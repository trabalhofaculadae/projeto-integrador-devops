# Configuração do Nginx dentro do contêiner da aplicação.
# O HTTPS não fica aqui: quem cuida dele é o Caddy, na frente deste contêiner.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não mostra a versão do Nginx nas respostas
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Verificação de saúde: usada pelo HEALTHCHECK do Docker, pelo pipeline e pelo monitoramento
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Versão publicada: nunca guardar em cache, para mostrar sempre o deploy mais recente
    location = /version.json {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
